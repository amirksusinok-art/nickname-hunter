services:
  - type: web
    name: nickdrop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DEV_MOCK
        value: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nickdrop-db
          property: connectionString

databases:
  - name: nickdrop-db
    plan: free
    databaseName: nickdrop
    user: nickhunter
    region: frankfurt
