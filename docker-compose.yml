services:
  postgres:
    image: postgres:16-alpine
    container_name: nickdrop_postgres
    environment:
      POSTGRES_USER: nickhunter
      POSTGRES_PASSWORD: nickhunter_pass
      POSTGRES_DB: nickdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nickhunter -d nickdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
